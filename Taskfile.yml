version: "3"

tasks:
  install:
    desc: Install dependencies
    cmds:
      - uv sync --locked

  deps:update:
    desc: Update dependencies
    cmds:
      - uv sync --upgrade

  mcp:build:
    desc: Build the local read-only repository file server
    cmds:
      - docker build --tag repo-compliance-repository-files:0.1.0 --file docker/repository-files/Dockerfile .

  ci:
    desc: Run all CI checks excluding integration tests
    cmds:
      - uv run --locked ruff check .
      - uv run --locked ruff format --check .
      - uv run --locked deptry .
      - uv run --locked pyrefly check
      - uv run --locked pytest --cov

  ci:full:
    desc: Run all CI checks including integration tests
    cmds:
      - task: ci
      - task: mcp:build
      - uv run --locked pytest -m integration

  adhoc:spelling:
    desc: Adhoc check that the repository spelling uses British English. Non-priority; just convenience.
    cmds:
      - npx --yes cspell@10.3.3 --locale en-GB --gitignore --dot --exclude .git --exclude uv.lock .

  adhoc:format:
    desc: Adhoc check that files which Ruff will not touch, are formatted correctly. Non-priority; just convenience.
    cmds:
      - npx --yes oxfmt@0.70.0 "." "!**/src/**" "!**/tests/**"
